name: detect-k8s-releases

on:
  schedule:
    # Runs at midnight UTC on the 1st and 15th of each month,
    # aligned with the Kubernetes monthly patch release cadence.
    - cron: '0 0 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    name: Detect latest K8s releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: hack/tools/detect-k8s-release/go.mod
          cache-dependency-path: hack/tools/detect-k8s-release/go.sum

      - name: Detect latest K8s releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run . --token "$GITHUB_TOKEN"
        working-directory: hack/tools/detect-k8s-release

      - name: Open PR if versions changed
        uses: peter-evans/create-pull-request@271a8d0340265f705b14dd6f4c65073cc4d7af87 # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-k8s-supported-versions
          commit-message: "hack/tools: update k8s-supported-versions.json"
          title: "hack/tools: update supported K8s versions"
          body: |
            Automated update of `hack/tools/detect-k8s-release/data/k8s-supported-versions.json`.

            Generated by the `detect-k8s-releases` workflow.
          labels: automated
          add-paths: hack/tools/detect-k8s-release/data/k8s-supported-versions.json
